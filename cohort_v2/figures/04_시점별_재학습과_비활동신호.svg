   <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #526175" x="31.5" y="53.568" transform="rotate(-0 31.5 53.568)">전체 기준집단 82,467명  |  3일 이상 연속 비활동: 마지막 학습일 이후 달력 날짜 기준</text>
