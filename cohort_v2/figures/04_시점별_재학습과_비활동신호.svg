  <g id="text_29">
   <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #526175" x="31.5" y="412.92" transform="rotate(-0 31.5 412.92)">비활동에는 기준일 이전부터 쉬던 사용자도 포함됩니다. 증가분 전체를 신규 이탈로 해석하지 않습니다.</text>
