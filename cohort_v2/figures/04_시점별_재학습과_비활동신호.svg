  <g id="text_28">
   <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #526175" x="31.5" y="388.368" transform="rotate(-0 31.5 388.368)">누적 재학습과 현재 비활동은 겹칠 수 있습니다. 한 번 복귀한 뒤 다시 쉬는 사용자도 있기 때문입니다.</text>
