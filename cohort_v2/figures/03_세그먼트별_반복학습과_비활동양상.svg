  <g id="text_40">
   <text style="font-weight: 700; font-size: 19px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #24364b" x="35.28" y="33.264" transform="rotate(-0 35.28 33.264)">복귀에 그친 사용자와 반복 학습자를 구분한다</text>
  </g>
  <g id="text_41">
   <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #526175" x="35.28" y="63.756" transform="rotate(-0 35.28 63.756)">정여진 세그먼트 고정: 3/1~7  |  추적: 2013.03.08~11  |  UTC · 사용자 기준</text>
  </g>
  <g id="text_42">
   <text style="font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #24364b" x="35.28" y="471.24" transform="rotate(-0 35.28 471.24)">4일 중 2일 이상 재학습한 비율은 꾸준형 55.9%, 습관 형성형 24.4%, 멈춤-꾸준형 22.3%입니다.</text>
  </g>
  <g id="text_43">
   <text style="font-size: 10.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #526175" x="35.28" y="498.96" transform="rotate(-0 35.28 498.96)">3일 비활동은 3/8에 한 번 재학습한 뒤 3/9~11에 기록이 없는 경우입니다. 장기 이탈 확정은 아닙니다.</text>
  </g>
  <g id="text_44">
