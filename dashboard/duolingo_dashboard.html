<title>듀오링고 현황</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 디자인 토큰: 초록은 강조에만, 바탕은 흰색과 옅은 회녹색. 모든 수치는 아래 DATA JSON에서 렌더링 */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --surface-2:#F1F4EC; --line:#E2E7DC; --line-strong:#C9D2C0;
  --ink:#18210F; --ink-2:#454F3E; --ink-3:#717B6A;
  --green:#58CC02; --green-deep:#2B7000; --green-mid:#89E219; --green-tint:#EFF8E4; --green-line:#CBE8AE; --green-ink:#2B7000;
  --muted-bar:#C3CCBB; --muted-bar-2:#E4E9DE; --warn:#E58A00; --warn-ink:#9A5500; --warn-tint:#FFF5E6; --warn-line:#F5D6A6;
  --h1:#B2DF78; --h2:#58CC02; --h3:#2B7000; --hm0:#F1F8E9; --hm1:#2B7000;
  --font-ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:var(--font-ui);
  --r:12px; --r-sm:8px;
  --side-bg:#173A10; --side-ink:#C9DDBB; --side-ink-2:#8FAA7F; --side-line:rgba(255,255,255,.08); --side-hover:rgba(255,255,255,.06); --side-active:rgba(137,226,25,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F140C; --surface:#161D12; --surface-2:#1C2517; --line:#29331F; --line-strong:#3A4731;
  --ink:#EAF1E3; --ink-2:#C2CCB9; --ink-3:#939F8A;
  --green:#58CC02; --green-deep:#9BE34A; --green-mid:#6FBF1F; --green-tint:#1B2814; --green-line:#2F4A1C; --green-ink:#9BE34A;
  --muted-bar:#4D5946; --muted-bar-2:#2A3425; --warn:#F49000; --warn-ink:#FFB04D; --warn-tint:#2E220F; --warn-line:#5A3F14;
  --h1:#4E7A22; --h2:#58CC02; --h3:#B8F06A; --hm0:#1C2617; --hm1:#89E219; --side-bg:#0B1308; --side-line:rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F140C; --surface:#161D12; --surface-2:#1C2517; --line:#29331F; --line-strong:#3A4731;
  --ink:#EAF1E3; --ink-2:#C2CCB9; --ink-3:#939F8A;
  --green:#58CC02; --green-deep:#9BE34A; --green-mid:#6FBF1F; --green-tint:#1B2814; --green-line:#2F4A1C; --green-ink:#9BE34A;
  --muted-bar:#4D5946; --muted-bar-2:#2A3425; --warn:#F49000; --warn-ink:#FFB04D; --warn-tint:#2E220F; --warn-line:#5A3F14;
  --h1:#4E7A22; --h2:#58CC02; --h3:#B8F06A; --hm0:#1C2617; --hm1:#89E219; --side-bg:#0B1308; --side-line:rgba(255,255,255,.06); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;margin:0;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{width:100%;max-width:1280px;padding:28px 36px 56px;min-width:0}
@media (max-width:880px){.wrap{padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}}

/* 상단: 제목과 기간 */
header.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--line)}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.3}
h1 .dot{color:var(--green)}
.subtitle{margin:0;font-size:13px;color:var(--ink-3)}

/* 좌측 사이드바 */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 14px 18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;border-bottom:1px solid var(--side-line)}
.brand .mark{flex:none;width:34px;height:34px;border-radius:9px;background:var(--green);color:#0F2A00;display:grid;place-items:center}
.brand b{display:block;font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.35}
.brand small{display:block;font-size:12px;color:var(--side-ink-2)}
.side-label{margin:22px 10px 8px;font-size:12px;color:var(--side-ink-2)}
nav.tabs{display:flex;flex-direction:column;gap:4px}
nav.tabs button{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-size:14px;font-weight:500;color:var(--side-ink);background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;position:relative}
nav.tabs button .ic{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button:hover{background:var(--side-hover);color:#fff}
nav.tabs button[aria-selected="true"]{background:var(--side-active);color:#fff;font-weight:600}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
nav.tabs button[aria-selected="true"] .ic{stroke:var(--green-mid)}
.side-foot{margin-top:auto;display:grid;gap:4px;padding:14px 12px;border-radius:10px;background:var(--side-hover);font-size:12px}
.side-foot .sf-t{color:var(--side-ink-2);margin-bottom:2px}
.side-foot dl{margin:0 0 6px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.side-foot dt{color:var(--side-ink-2);white-space:nowrap}
.side-foot dd{margin:0;color:#fff;font-weight:600;white-space:nowrap}
.side-foot small{color:var(--side-ink-2);font-size:11px;line-height:1.5}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px 16px 0;flex-direction:column}
  .brand{padding:0 0 12px;border-bottom:0}
  .side-label{display:none}
  .side-foot{order:3;margin:0 0 12px;padding:10px 12px}
  .side-foot dl{margin:0}
  .side-foot .sf-t,.side-foot small{display:none}
  nav.tabs{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:10px;scrollbar-width:none}
  nav.tabs button{width:auto;flex:none;padding:8px 12px}
  nav.tabs button[aria-selected="true"]::before{left:12px;right:12px;top:auto;bottom:-4px;width:auto;height:3px;border-radius:3px 3px 0 0}
}
:is(nav.tabs button,.seg-pick button,.toggle,summary,.tile,.acard,.toact):focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}

/* 공통 블록 */
.panel{display:grid;gap:24px}
.head{display:grid;gap:4px}
.lead{font-size:18px;font-weight:600;letter-spacing:-.01em;max-width:68ch;margin:0;line-height:1.5}
.lead strong{color:var(--green-ink);font-weight:700}
.howto{font-size:13px;color:var(--ink-3);margin:0;max-width:80ch}
.period{font-size:12px;color:var(--ink-3);margin:0}
.grid{display:grid;gap:12px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-kpi5{grid-template-columns:repeat(5,1fr)}
.g-input{grid-template-columns:1fr 1fr}
.g-alert{grid-template-columns:1fr repeat(3,1.25fr)}
@media (max-width:960px){.g-kpi5,.g-alert{grid-template-columns:repeat(2,1fr)}.g-2,.g-3{grid-template-columns:1fr}}
@media (max-width:560px){.g-kpi5,.g-alert,.g-input{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;min-width:0}
@media (max-width:560px){.card{padding:16px}}
.card h2{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;line-height:1.4}
.card .sub{font-size:13px;color:var(--ink-3);margin:0 0 16px}
.kgroup{display:grid;gap:12px}
.glabel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--green-ink);background:var(--green-tint);border-radius:6px;padding:2px 8px}
.chip b{font-weight:700}

/* 지표 카드 */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .id{font-size:12px;font-weight:600;color:var(--green-ink)}
.kpi .lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.kpi .lab small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:6px}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:2px}
.kpi .foot{font-size:12.5px;color:var(--ink-3)}
.kpi.hero{background:var(--green-tint);border-color:var(--green-line);padding:20px 24px}
.kpi.hero .lab{font-size:14px;color:var(--ink)}
.kpi.hero .val{font-size:44px;color:var(--green-deep);letter-spacing:-.03em}
.kpi.hero .why{font-size:13px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--green-line);max-width:90ch}
.kpi.hero .why b{color:var(--ink)}
.kpi.warn .val{color:var(--warn-ink)}
.kpi.warn .lab::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.delta{display:inline-block;font-weight:600;font-size:12px;border-radius:6px;padding:0 6px;margin-left:4px;white-space:nowrap}
.delta.good{background:var(--green-tint);color:var(--green-ink)}
.delta.bad{background:var(--warn-tint);color:var(--warn-ink)}
.delta.flat{background:var(--surface-2);color:var(--ink-3)}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;width:max-content;max-width:100%;margin-top:8px}
.link::before{content:"";width:6px;height:6px;border-radius:50%}
.link.obs{background:var(--green-tint);color:var(--green-ink)}
.link.obs::before{background:var(--green)}
.link.hyp{background:var(--warn-tint);color:var(--warn-ink)}
.link.hyp::before{background:transparent;border:1.5px solid var(--warn)}
.role{display:inline-flex;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--surface-2);color:var(--ink-2)}
.tree-stem{position:relative;height:24px}
.tree-stem::before{content:"";position:absolute;left:50%;top:0;height:12px;border-left:1px solid var(--line-strong)}
.tree-stem::after{content:"";position:absolute;left:25%;right:25%;top:12px;height:12px;border:1px solid var(--line-strong);border-bottom:0;border-radius:6px 6px 0 0}
@media (max-width:560px){.tree-stem::after{display:none}.tree-stem::before{height:24px}}

/* 세그먼트 선택: 세그먼트 컨트롤 */
.seg-pick,.d-pick{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;width:fit-content;max-width:100%}
.seg-pick button,.d-pick button{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:7px;background:none;color:var(--ink-3);padding:6px 12px;cursor:pointer}
.seg-pick button:hover{color:var(--ink)}
.seg-pick button[aria-pressed="true"],.d-pick button[aria-pressed="true"]{background:var(--surface);color:var(--green-ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(24,33,15,.06)}
.selsum{margin:0;font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px}
.selsum b{color:var(--ink)}
.toggle{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink-2);padding:6px 12px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--green);color:var(--green-ink);background:var(--green-tint)}

/* 요약 문장 */
.insight{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:grid;gap:10px}
.insight p{margin:0;font-size:14px;padding-left:16px;position:relative}
.insight p::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--green)}
.toact{color:var(--green-ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--green-line);text-underline-offset:4px;margin-left:4px}
.toact:hover{text-decoration-color:var(--green)}
.concl{margin:14px 0 0;font-size:14px;font-weight:600;color:var(--ink);background:var(--green-tint);border-radius:var(--r-sm);padding:10px 14px}
.note{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}
.note.caution{color:var(--warn-ink)}

/* 차트 */
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--font-ui);fill:var(--ink-3)}
svg .num{font-weight:700;fill:var(--ink)}
svg .axis{stroke:var(--line-strong);stroke-width:1}
svg .grid{stroke:var(--line);stroke-width:1}
.hit{cursor:default}
.hit:hover rect.bar,.hit:hover rect.cell{filter:brightness(1.06)}
/* 좁은 화면에서는 차트 글씨가 작아지지 않게 가로로 밀어 본다 */
.card{overflow-x:auto}
@media (max-width:640px){.card > svg,#hazard > svg{min-width:640px}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:760px){.cmp{grid-template-columns:1fr}}
.cmp .box{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.cmp .box h3{font-size:14px;font-weight:700;margin:0}
.cmp .box .s{font-size:12px;color:var(--ink-3);margin:0 0 4px}

/* 표 */
table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl{overflow-x:auto}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left}
td.num{font-weight:600}
tr.prio td:first-child{font-weight:700}

/* 세그먼트 맵 */
.badge{display:inline-flex;align-items:center;font-weight:700;font-size:11px;border-radius:5px;padding:1px 6px;background:var(--green);color:#fff;margin-left:6px;vertical-align:1px}
.badge.alt{background:var(--surface-2);color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:auto repeat(3,1fr);gap:10px;align-items:stretch}
.tiles .rh{font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;max-width:92px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:grid;gap:2px;text-align:left;font:inherit;color:inherit;min-width:0}
.tile.prio{border-color:var(--green-line);background:var(--green-tint);cursor:pointer}
.tile.prio:hover{border-color:var(--green)}
.tile .nm{font-weight:700;font-size:14px}
.tile .cnt{font-weight:700;font-size:22px;letter-spacing:-.02em}
.tile .rule{font-size:12px;color:var(--ink-3)}
.tile .bar{height:4px;border-radius:2px;background:var(--muted-bar-2);overflow:hidden;margin-top:8px}
.tile .bar i{display:block;height:100%;background:var(--muted-bar)}
.tile.prio .bar i{background:var(--green)}
@media (max-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}.tiles .rh{grid-column:1/-1;max-width:none}}

/* 알림 카드 */
.acard{font:inherit;color:inherit;text-align:left;cursor:pointer}
.acard:hover{border-color:var(--line-strong)}
.acard .lab{display:flex;align-items:center;flex-wrap:wrap}
.acard[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.acard .meta,.acard .plan{display:grid;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.acard .meta b,.acard .plan b{color:var(--ink-3);font-weight:500;margin-right:6px}
.hist-read{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:6px;padding:10px 14px;background:var(--surface-2);border-radius:var(--r-sm);font-size:13px;color:var(--ink-2)}
.hist-read b{color:var(--ink)}
.hist-read i{display:inline-block;vertical-align:middle;margin-right:6px}
.hist-read .dash{width:22px;border-top:2px dashed var(--ink-3)}
.hist-read .ring{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--warn)}
.acard .plan .bv{font-weight:700;color:var(--ink);font-size:13.5px}
.levers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 16px}
.lever{display:grid;gap:4px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface)}
.lever.up{border-color:var(--green-line);background:var(--green-tint)}
.lever.down{border-color:var(--warn-line);background:var(--warn-tint)}
.lever .lv-lab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3)}
.lever.up .lv-lab{color:var(--green-ink)}.lever.down .lv-lab{color:var(--warn-ink)}
.lever .lv-path{font-size:13px;font-weight:600;color:var(--ink-2)}
.lever .lv-val{font-family:var(--font-num);font-size:24px;font-weight:800;color:var(--ink)}
.lever .lv-val small{font-size:12px;font-weight:600;color:var(--ink-3);margin-left:6px}
.verdict{display:inline-flex;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;width:max-content;margin-top:4px}
.verdict.ok{background:var(--green-tint);color:var(--green-ink)}
.verdict.no{background:var(--surface-2);color:var(--ink-3)}

/* 접기 */
details{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:600;font-size:13.5px}
details[open] summary{margin-bottom:10px}
.more{border:0;padding:0;background:none;border-radius:0;margin-top:12px}
.more summary{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green-ink);list-style:none;padding:2px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+";font-weight:700;width:16px;height:16px;border-radius:4px;background:var(--green-tint);display:inline-grid;place-items:center;font-size:12px}
.more[open] summary::before{content:"−"}

footer{margin-top:32px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:4px;font-size:12px;color:var(--ink-3)}
footer strong{color:var(--ink-2);font-weight:600;margin-right:4px}
/* 세그먼트 이동표 */
.mig td,.mig th{padding:8px 10px;text-align:center}
.mig th:first-child,.mig td:first-child{text-align:left}
.mig td.c{font-weight:600;color:var(--ink)}
.mig td.c.hi{color:#0F2A00}
.mig th.goal{color:var(--green-ink)}
.mig tr.prio td:first-child{font-weight:700}
.mig td.n{color:var(--ink-3);font-weight:500}
/* 실험 카드 */
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:960px){.xgrid{grid-template-columns:1fr}}
.xcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;display:grid;gap:10px;align-content:start}
.xcard h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center}
.xcard .hyp{margin:0;font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:6px;padding:8px 10px}
.xcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.xcard dt{color:var(--ink-3)}
.xcard dd{margin:0;color:var(--ink);font-weight:600}
.xcard dd small{font-weight:400;color:var(--ink-3)}
.funnel{display:grid;grid-template-columns:repeat(3,1fr);border:1px dashed var(--line-strong);border-radius:6px;overflow:hidden}
.funnel div{padding:8px 10px;display:grid;gap:2px;border-right:1px dashed var(--line-strong)}
.funnel div:last-child{border-right:0}
.funnel span{font-size:11.5px;color:var(--ink-3)}
.funnel b{font-size:15px;color:var(--ink-3);font-weight:600}
/* 실행 제안 */

.step p{margin:0;font-size:12.5px;color:var(--ink-2)}

// ---------- 차트: 학습일별 복귀율
function barsByDays() {
  const rows = DATA.ret_by_days, W = 1000, H = 300, L = 44, R = 16, T = 34, B = 44;
  const iw = W - L - R, ih = H - T - B, bw = iw / rows.length;
  const y = v => T + ih - v / 100 * ih;
  const jump = rows.map((r, i) => i ? r.ret - rows[i - 1].ret : -Infinity);
  const jmax = jump.indexOf(Math.max(...jump));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="기준 주간 학습일별 후속 4일 복귀율">`;
  [0, 25, 50, 75, 100].forEach(t => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11">${t}%</text>`; });
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * .26, w = bw * .48, hot = i === jmax || i === jmax - 1;
    s += `<g class="hit"${tipAttr(`학습일 ${r.days}일 · ${n0(r.n)}명 · 후속 4일 복귀율 ${p1(r.ret)}`)}>`;
    s += `<rect class="bar" x="${x}" y="${y(r.ret)}" width="${w}" height="${Math.max(0, y(0) - y(r.ret))}" rx="4" fill="${hot ? "var(--green)" : "var(--muted-bar)"}"/>`;
    s += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent"/>`;
    s += `<text class="num" x="${x + w / 2}" y="${y(r.ret) - 6}" text-anchor="middle" font-size="12.5">${r.ret.toFixed(1)}</text>`;
    s += `<text x="${x + w / 2}" y="${H - B + 18}" text-anchor="middle" font-size="12">${r.days}일</text></g>`;
  });
  const xa = L + (jmax - 1) * bw + bw / 2, xb = L + jmax * bw + bw / 2, ya = y(rows[jmax].ret) - 24;
  s += `<path d="M${xa} ${ya + 6}V${ya}H${xb}V${ya + 6}" fill="none" stroke="var(--green-deep)" stroke-width="1.5"/>`;
  s += `<text x="${(xa + xb) / 2}" y="${ya - 6}" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--green-ink)">${pp(jump[jmax])}</text>`;
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  s += `<text x="${L + iw / 2}" y="${H - 6}" text-anchor="middle" font-size="11.5" style="fill:var(--ink-3)">기준 주간 학습일 수</text></svg>`;
  return {svg: s, from: rows[jmax - 1].days, to: rows[jmax].days, jump: jump[jmax]};
}

// ---------- 차트: 운영용 북극성 지표 (기준일별 최근 7일, 0부터)
function opsNsm() {
  const rows = DATA.ops_nsm, W = 1000, H = 250, L = 52, R = 16, T = 30, B = 48;
  const iw = W - L - R, ih = H - T - B, bw = iw / rows.length, max = 12000;
  const y = v => T + ih - v / max * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="기준일별 최근 7일 북극성 지표">`;
  [0, 4000, 8000, 12000].forEach(t => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11">${n0(t)}</text>`; });
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * .3, w = bw * .4, first = i === 0;
    s += `<g class="hit"${tipAttr(`기준일 ${r.d}(${r.dow}) · 최근 7일 ${r.from}~${r.to} 중 4일 이상 학습 ${n0(r.n)}명`)}>`;
    s += `<rect class="bar" x="${x}" y="${y(r.n)}" width="${w}" height="${y(0) - y(r.n)}" rx="4" fill="${first ? "var(--green)" : "var(--muted-bar)"}"/>`;
    s += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent"/>`;
    s += `<text class="num" x="${x + w / 2}" y="${y(r.n) - 6}" text-anchor="middle" font-size="12.5">${n0(r.n)}</text>`;
    s += `<text x="${x + w / 2}" y="${H - B + 18}" text-anchor="middle" font-size="12">${r.d} (${r.dow})</text>`;
    s += `<text x="${x + w / 2}" y="${H - B + 33}" text-anchor="middle" font-size="10.5" style="fill:var(--ink-3)">${r.from}~${r.to}</text></g>`;
  });
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  const ns = rows.map(r => r.n);
  return {svg: s, lo: Math.min(...ns), hi: Math.max(...ns)};
}

// ---------- 탭 1: 주간 현황
let curFilter = "전체";
function linked(name) {
  const K = DATA.kpi;
  if (name === "전체") return {n: K.B1, share: 100, ret: K.O1, ret2: K.O2, risk_n: K.O3_n, risk: K.O3, next: DATA.i1_later.all};
  const s = SEG[name];
  return {n: s.n, share: s.user_pct, ret: s.ret, ret2: s.ret2, risk_n: s.nonret, risk: s.nonret / s.n * 100, next: s.i1_later};
}
function tabSummary() {
  const K = DATA.kpi, A = barsByDays(), OP = opsNsm(), v = linked(curFilter), all = linked("전체"), isAll = curFilter === "전체";
  // 전체 대비 차이: higherGood이면 높을수록 초록, 아니면 높을수록 주황
  const dl = (a, b, higherGood = true) => {
    if (isAll) return "";
    const d = a - b, cls = Math.abs(d) < 0.05 ? "flat" : ((d > 0) === higherGood ? "good" : "bad");

        <div class="kpi"${tipAttr(`최근 이틀(3/6·3/7) 학습하지 않은 ${n0(K.I2_n)}명 중 후속 4일(3/8~3/11)에 하루라도 학습한 비율`)}><span class="lab">멈춤 사용자 복귀율</span><span class="val">${K.I2.toFixed(1)}<small>%</small></span><span class="foot">3/6~3/7 미학습 ${n0(K.I2_n)}명(전체의 ${p1(stopShare)}) 기준</span>

// ---------- 차트: 날짜별 재학습률 (후속 4일, 주말 음영)
function dailyChart() {
  const days = [["3/8", "금"], ["3/9", "토"], ["3/10", "일"], ["3/11", "월"]];
  const ser = [["습관 형성형", SEG["습관 형성형"].daily, "var(--h3)"], ["최근 단발형", SEG["최근 단발형"].daily, "var(--h2)"],
               ["멈춤-꾸준형", SEG["멈춤-꾸준형"].daily, "var(--warn)"], ["전체", DATA.daily_all, "var(--muted-bar)"]];
  const W = 1000, H = 280, L = 48, R = 130, T = 26, B = 46, iw = W - L - R, ih = H - T - B, max = 35;
  const xs = k => L + k * (iw / 3), y = v => T + ih - v / max * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="후속 4일 날짜별 재학습률">`;
  s += `<rect x="${(xs(0) + xs(1)) / 2}" y="${T}" width="${xs(2.5) - xs(0.5)}" height="${ih}" fill="var(--surface-2)"/>`;
  s += `<text x="${xs(1.5)}" y="${T + 14}" text-anchor="middle" font-size="11.5" font-weight="800" style="fill:var(--ink-3)">주말</text>`;
  [0, 10, 20, 30].forEach(t => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11">${t}%</text>`; });
  ser.forEach(([name, vals, color]) => {
    s += `<polyline points="${vals.map((v, k) => `${xs(k)},${y(v)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="${name === "전체" ? 2 : 2.75}" ${name === "전체" ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
    vals.forEach((v, k) => { s += `<g class="hit"${tipAttr(`${name} · ${days[k][0]}(${days[k][1]}) 학습 ${p1(v)}`)}><circle cx="${xs(k)}" cy="${y(v)}" r="11" fill="transparent"/><circle cx="${xs(k)}" cy="${y(v)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/></g>`; });
  });
  // 끝 라벨이 겹치지 않게 최소 16px 간격으로 밀어 낸다
  const labs = ser.map(([name, vals]) => ({name, v: vals[3], y: y(vals[3]) + 4})).sort((a, b) => a.y - b.y);
  labs.forEach((l, i) => { if (i && l.y - labs[i - 1].y < 16) l.y = labs[i - 1].y + 16; });
  labs.forEach(l => { s += `<text x="${xs(3) + 12}" y="${l.y}" font-size="12" font-weight="800" style="fill:var(--ink)">${l.name} ${l.v.toFixed(1)}</text>`; });
  days.forEach(([d, w], k) => { s += `<text x="${xs(k)}" y="${H - B + 20}" text-anchor="middle" font-size="12">${d} (${w})</text>`; });
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  return s;
}

// ---------- 탭 2: 이탈 시점
let showHist = false;
function hazardChart() {
  const Hz = DATA.hazard, W = 1000, H = 330, L = 56, R = 130, T = 26, B = 50;
  const iw = W - L - R, ih = H - T - B, xs = k => L + k * (iw / 3), y = v => T + ih - v / 100 * ih;
  const lab = ["학습 직후", "1일 쉼", "2일 쉼", "3일 쉼"];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="쉬는 날 수별 4일 안 복귀율">`;
  [0, 25, 50, 75, 100].forEach(t => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11">${t}%</text>`; });
  s += `<rect x="${xs(0)}" y="${T}" width="${xs(1) - xs(0)}" height="${ih}" fill="var(--warn-tint)"/>`;
  s += `<text x="${(xs(0) + xs(1)) / 2}" y="${T + 14}" text-anchor="middle" font-size="11.5" font-weight="800" style="fill:var(--warn-ink)">쉬는 첫날</text>`;
  const line = (pts, color, w) => `<polyline points="${pts.map((p, k) => `${xs(k)},${y(p.within4)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const series = showHist
    ? [["h1", "이력 1일", "var(--h1)"], ["h2", "이력 2일", "var(--h2)"], ["h3", "이력 3일+", "var(--h3)"]]
    : [["all", "전체", "var(--green-deep)"]];
  series.forEach(([key, name, color]) => {
    const pts = Hz[key];
    s += line(pts, color, showHist ? 2.5 : 3);
    pts.forEach((p, k) => {
      s += `<g class="hit"${tipAttr(`${name} · ${lab[k]} · 그 시점까지 안 온 ${n0(p.risk_n)}건 중 4일 안 복귀 ${p1(p.within4)} · 다음 날 복귀 ${p1(p.next)}`)}><circle cx="${xs(k)}" cy="${y(p.within4)}" r="12" fill="transparent"/><circle cx="${xs(k)}" cy="${y(p.within4)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
      if (!showHist) s += `<text class="num" x="${xs(k)}" y="${y(p.within4) - 12}" text-anchor="middle" font-size="13">${p.within4.toFixed(1)}</text>`;
      // 이력별 보기: 마지막 점은 오른쪽 이름표에 값이 있으므로 나머지 점에만 값을 단다 (맨 위 선은 위, 나머지는 아래에 두어 겹치지 않게)
      else if (k < 3) s += `<text class="num" x="${xs(k)}" y="${y(p.within4) + (key === "h3" ? (k === 2 ? -18 : -10) : 19)}" text-anchor="middle" font-size="12" style="paint-order:stroke;stroke:var(--surface);stroke-width:4px">${p.within4.toFixed(1)}</text>`;
      s += `</g>`;
    });
    const last = pts[3];
    s += `<text x="${xs(3) + 12}" y="${y(last.within4) + 4}" font-size="12" font-weight="800" style="fill:var(--ink)">${name} ${showHist ? last.within4.toFixed(1) : ""}</text>`;
  });
  if (showHist) {
    // 비교 기준: 이력 1일의 학습 직후 값을 점선으로 긋고, 이력 3일+의 2일 쉼 점을 강조
    const ref = Hz.h1[0].within4, hit = Hz.h3[2].within4;
    s += `<line x1="${xs(0)}" x2="${xs(2)}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
    s += `<circle cx="${xs(2)}" cy="${y(hit)}" r="10" fill="none" stroke="var(--warn)" stroke-width="2.5"/>`;
  }
  if (!showHist) {
    const a = Hz.all;
    [1, 2, 3].forEach(k => { s += `<text x="${(xs(k - 1) + xs(k)) / 2}" y="${y((a[k - 1].within4 + a[k].within4) / 2) + 20}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ink-3)">${a[k].chg_within4}%</text>`; });
  }
  lab.forEach((t, k) => { s += `<text x="${xs(k)}" y="${H - B + 20}" text-anchor="middle" font-size="12">${t}</text>`; });
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  s += `<text x="${L + iw / 2}" y="${H - 6}" text-anchor="middle" font-size="11.5" style="fill:var(--ink-3)">마지막 학습 뒤 쉰 날 수</text></svg>`;
  return s;
}

    <p class="note caution">오래 쉰 쪽에는 원래 잘 안 오는 사람이 많이 남는 효과가 섞여 있다. 쉬어서 멀어진 것인지 원래 그런 사람인지는 나눌 수 없다.</p>`)}</div>
  <div class="insight">
    <p>다음 날 복귀: 학습 직후 <b>${p1(a[0].next)}</b> → 하루 쉬면 <b>${p1(a[1].next)}</b> (<b>${a[1].chg_next}%</b>). <a class="toact" href="#segments" data-seg="습관 형성형">→ 그래서 학습한 다음 날 알림 (습관 형성형·최근 단발형)</a></p>
    <p>이력 3일 이상이 이틀 쉰 뒤(<b>${p1(Hz.h3[2].within4)}</b>)는 이력 1일이 방금 학습한 직후(<b>${p1(Hz.h1[0].within4)}</b>)와 비슷하다. <a class="toact" href="#segments" data-seg="멈춤-꾸준형">→ 그래서 이력 많은 사람은 이틀 쉰 날에도 알림 (멈춤-꾸준형)</a></p>
  </div>
  <div class="card"><h2>주말에는 최근에 학습한 사람의 재학습이 내려갔다가 월요일에 다시 오른다</h2>

  </div>
`;
}

let curSeg = "습관 형성형";

    <span class="nm">${name}${pr ? `<span class="badge">${pr}순위</span>` : ""}</span>

// ---------- 탭 3: 세그먼트 이동표 (운영용 정의로 3/8과 3/12에 각각 분류)
function migrationCard() {
  const M = DATA.migration, goal = M.cols.indexOf("꾸준형");
  const h = M.rows.find(r => r.from === "습관 형성형");
  const label = c => c === "최근 7일 학습 없음" ? "최근 7일 학습 없음" : c;
  const fromLabel = c => c === "최근 7일 학습 없음" ? "새로 등장 (3/1~3/7 기록 없음)" : c;
  const cell = (v, n, from, to) => {
    const a = Math.min(85, v * 1.1), hi = v >= 45;
    return `<td class="c${hi ? " hi" : ""}"${tipAttr(`${fromLabel(from)} → ${label(to)} · ${n0(n)}명 (${p1(v)})`)} style="background:color-mix(in srgb, var(--green) ${a.toFixed(0)}%, transparent)">${v ? v.toFixed(1) : "–"}</td>`;
  };
  // 듀오링고 Growth Model처럼 우선 세그먼트마다 "움직일 이동" 하나를 레버로 본다
  const LEVER = [["습관 형성형", "꾸준형", "up", "올릴 이동"], ["최근 단발형", "멈춤-저활동형", "down", "줄일 이동"], ["멈춤-꾸준형", "최근 7일 학습 없음", "down", "줄일 이동"]];
  const lever = ([f, t, dir, lab]) => {
    const r = M.rows.find(x => x.from === f), k = M.cols.indexOf(t);
    return `<div class="lever ${dir}"${tipAttr(`${f} ${n0(r.n)}명 중 ${n0(r.to[k])}명이 4일 뒤 ${label(t)}로 이동 · 알림 없이 관찰된 값`)}><span class="lv-lab">${lab}<span class="badge">${PRIO[f]}순위</span></span><span class="lv-path">${f} → ${t === "꾸준형" ? "꾸준형 (북극성)" : label(t)}</span><span class="lv-val">${p1(r.pct[k])}<small>${n0(r.to[k])}명</small></span></div>`;
  };
  const rows = M.rows.map(r => `<tr class="${PRIO[r.from] ? "prio" : ""}"><td>${fromLabel(r.from)}${PRIO[r.from] ? `<span class="badge">${PRIO[r.from]}</span>` : ""}</td><td class="n">${n0(r.n)}</td>${r.pct.map((v, k) => cell(v, r.to[k], r.from, M.cols[k])).join("")}</tr>`).join("");
  return `<div class="card"><h2>4일 뒤 습관 형성형의 ${p1(h.pct[goal])}(${n0(h.to[goal])}명)가 꾸준형으로 올라갔다</h2>
    <p class="sub">${M.from_d} → ${M.to_d} 세그먼트 이동 · 행 합계 100% · 알림 없이 관찰된 값</p>
    <div class="levers">${LEVER.map(lever).join("")}</div>
    <div class="tbl"><table class="mig"><thead><tr><th>${M.from_d} 세그먼트</th><th>인원</th>${M.cols.map((c, k) => `<th class="${k === goal ? "goal" : ""}">${k === goal ? "꾸준형 (북극성)" : label(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// 양측 검정 표본 수(50:50 배정)로 목표 상승폭을 판정하는 데 필요한 날 수. exp_plan의 3%p 기간과 같은 식
function needDays(base, lift, n) {
  const E = DATA.exp_plan, za = 1.959964, zb = E.power === 0.8 ? 0.841621 : 1.281552;
  const a = base / 100, b = Math.min(0.999, (base + lift) / 100);
  const per = (za + zb) ** 2 * (a * (1 - a) + b * (1 - b)) / (b - a) ** 2;
  return Math.ceil(2 * per / n);
}
function actionCard(name) {

  return `<div class="xcard act">

}

}
// 단기 성공 지표가 장기 북극성으로 이어지는지 한 줄로 보여 주는 지표 사다리

      <div class="arrow"${tipAttr(`3/1 첫 학습자 ${n0(F.cohort_n)}명 중 3/2에 다시 온 사람과 안 온 사람의 주 4일 달성 비율. 관찰된 연관`)}><b>${p1(F.came_4d)} 대 ${p1(F.not_4d)}</b>주 4일 달성 (다음 날 온 vs 안 온)</div>

      <div class="step now"><span class="sn">1단계 · 알림 실험</span><b>최근 단발형 → 습관 형성형</b><p>+${DATA.exp_plan.lift}%p 판정: 최근 단발형 ${dd("최근 단발형")}일, 습관 형성형 ${dd("습관 형성형")}일, 멈춤-꾸준형 ${dd("멈춤-꾸준형")}일</p></div>
      <div class="step"><span class="sn">2단계 · 앱 안 장치 실험</span><b>학습일 진행 막대 · 다음 학습일 카드</b><p>알림만 / 장치만 / 둘 다 / 없음으로 배정</p></div>
      <div class="step"><span class="sn">3단계 · 판정</span><b>채택 또는 수정</b><p>성공 지표·꾸준형 이동 상승, 수신 거부 증가 없음이면 채택</p></div>
      <div class="step"><span class="sn">4단계 · 확대·장기 측정</span><b>다른 세그먼트 · 북극성 추적</b><p>멈춤-몰입형 등으로 확대, 주 4일 학습자 수 추적</p></div>
    </div></div>`;
}

// ---------- 라우팅
const RENDER = {summary: tabSummary, timing: tabTiming, segments: tabSegments, action: tabAction};
let cur = "summary";
// 화면 상태(탭, 세그먼트 필터, 탭 3 세그먼트, 이력별 보기)를 URL에 담아 링크로 같은 화면을 연다. 예: #segments?s=멈춤-꾸준형
function stateHash() {
  const q = new URLSearchParams();
  if (curFilter !== "전체") q.set("f", curFilter);
  if (curSeg !== "습관 형성형") q.set("s", curSeg);
  if (showHist) q.set("h", "1");
  if (cur === "action" && curLift !== 3) q.set("l", String(curLift));
  const s = q.toString();
  return "#" + cur + (s ? "?" + s : "");
}
function readHash() {
  const [id, qs] = decodeURIComponent(location.hash.slice(1)).split("?");
  const q = new URLSearchParams(qs || "");
  const f = q.get("f"), s = q.get("s");
  curFilter = f && SEG[f] ? f : "전체";
  curSeg = s && PRIO[s] ? s : "습관 형성형";
  showHist = q.get("h") === "1";
  const l = Number(q.get("l"));
  curLift = Number.isInteger(l) && l >= 1 && l <= 10 ? l : 3;
  return RENDER[id] ? id : "summary";
}
function show(id) {
  if (!RENDER[id]) id = "summary";
  cur = id;
  document.getElementById("main").innerHTML = `<section class="panel" role="tabpanel" aria-labelledby="tab-${id}">${RENDER[id]()}</section>`;
  tabsEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
  const T = TABS.find(x => x.id === id);
  document.getElementById("pageTitle").textContent = T.name;
  document.title = T.name + " | 듀오링고 학습 유지 현황";
  try { history.replaceState(null, "", stateHash()); } catch (e) {}
}
document.getElementById("main").addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (g) { e.preventDefault(); show(g.dataset.goto); window.scrollTo({top: 0, behavior: "auto"}); return; }
  const f = e.target.closest("[data-filter]"); if (f) { curFilter = f.dataset.filter; show("summary"); document.getElementById("f-" + curFilter)?.focus(); return; }
  const s = e.target.closest("[data-seg]");
  if (s) {
    const fromTile = s.classList.contains("tile"), fromLink = s.tagName === "A";
    if (fromLink) e.preventDefault();
    curSeg = s.dataset.seg; show("segments");
    if (fromLink) window.scrollTo({top: 0, behavior: "auto"});
    if (fromTile) document.getElementById("detail")?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
    return;
  }
  if (e.target.closest("#histToggle")) { showHist = !showHist; show("timing"); }
});
document.getElementById("main").addEventListener("input", e => {
  if (e.target.id !== "lift") return;
  curLift = Number(e.target.value);
  document.getElementById("liftv").textContent = "+" + curLift + "%p";
  document.getElementById("sim").innerHTML = simHtml();
  try { history.replaceState(null, "", stateHash()); } catch (x) {}
});
// ---------- 툴팁
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el) { tip.classList.remove("on"); return; }
  tip.textContent = el.getAttribute("data-tip");
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.add("on");
});
document.addEventListener("pointerleave", () => tip.classList.remove("on"));

// 화면에 쓰는 숫자끼리 서로 맞는지 브라우저에서 다시 확인한다 (컬리의 주문·배송·출고 건수 대조와 같은 방식)
function checksHtml() {
  const K = DATA.kpi, sum = a => a.reduce((x, y) => x + y, 0);
  const C = [
    ["6개 세그먼트 인원 합계 = 주간 학습자", sum(DATA.segments.map(s => s.n)) === K.B1],
    ["학습일 1~7일 인원 합계 = 주간 학습자", sum(DATA.ret_by_days.map(r => r.n)) === K.B1],
    ["학습일 4일 이상 인원 합계 = 북극성 지표", sum(DATA.ret_by_days.filter(r => r.days >= 4).map(r => r.n)) === K.N1],
    ["복귀자 + 이탈 위험 = 주간 학습자 (복귀율 일치)", Math.abs((K.B1 - K.O3_n) / K.B1 * 100 - K.O1) < 0.05],
    ["운영용 3/8 북극성 = 분석용 북극성", DATA.ops_nsm[0].n === K.N1],
    ["이동표 행 합계 = 3/8 세그먼트 인원", DATA.migration.rows.slice(0, 6).every((r, i) => sum(r.to) === r.n && r.n === DATA.segments[i].n)],
    ["실험 대상 인원 = 오늘 알림 대상 카드", DATA.exp_plan.rows.every(r => r.n === ALERT[r.seg].n)],
    ["실행 제안 탭 판정 기간(+3%p) = 실험 설계 기간", DATA.exp_plan.rows.every(r => needDays(r.base, DATA.exp_plan.lift, r.n) === r.days)]
  ];
  const ok = C.filter(c => c[1]).length;
  return `<details><summary><strong>점검</strong> 노션 대조 ${DATA.checks}개 · 화면 숫자 대조 ${ok}/${C.length} 통과${ok === C.length ? "" : " · 확인 필요"}</summary><ul class="checks">${C.map(([t, v]) => `<li class="${v ? "" : "bad"}">${t}</li>`).join("")}</ul><p class="note">빌드 ${DATA.meta.built || ""} · 노션 「듀오링고 이탈 방지 분석」 ${DATA.meta.notion_edited || ""} 수정본 기준</p></details>`;
}
document.getElementById("foot").innerHTML = `
  <span><strong>데이터</strong> 가입일·유입·결제·알림 정보가 없는 공개 학습 기록이다.</span>
  <span><strong>해석</strong> 모든 결과는 관찰된 연관성이다. "멈춤"과 "이탈 위험"은 영구 이탈이 아니다. 알림 대상은 실제 발송 기록이 아니라 알림 조건에 맞는 인원이다.</span>`;

window.addEventListener("hashchange", () => { if (decodeURIComponent(location.hash) !== decodeURIComponent(stateHash())) show(readHash()); });
show(readHash());
</script>
